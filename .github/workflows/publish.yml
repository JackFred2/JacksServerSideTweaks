name: publish
run-name: Publish JSST

on:
  workflow_dispatch:
    inputs:
      ignoreNoChangelog:
        description: 'Allow no changelog'
        default: false
        required: true
        type: boolean
      createTag:
        description: 'Create new tag'
        default: true
        required: true
        type: boolean
      publishToMaven:
        description: 'Publish to Maven repository'
        default: true
        required: true
        type: boolean
      publishToGitHub:
        description: 'Publish as a GitHub release'
        default: true
        required: true
        type: boolean
      publishToCurseforge:
        description: 'Publish to CurseForge'
        default: false
        required: true
        type: boolean
      publishToModrinth:
        description: 'Publish to Modrinth'
        default: false
        required: true
        type: boolean

permissions:
  contents: write # for github release

jobs:
  publish:
    strategy:
      matrix:
        java: [21]
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - id: gradle-version-grabber
        name: Grab version from gradle.properties, prefix with 'v'
        run: |
          version=$(grep 'mod_version=' gradle.properties | cut -d'=' -f2)
          if [[ -z $version ]]; then
            exit 1
          fi
          
          echo "mod_version=v$version" >> "$GITHUB_OUTPUT"

      - name: Possibly check for changelog file
        if: ${{ inputs.ignoreNoChangelog == false }}
        run: |
          if [[ ! -f "changelogs/${{ steps.gradle-version-grabber.outputs.mod_version }}.md" ]]; then
            exit 1
          fi

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'

      - name: Setup Gradle & Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            loom-cache

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew chiseledBuild

      - name: Check tag doesn't already exist
        if: ${{ inputs.createTag == true }}
        run: |
          if git show-ref --tags --verify --quiet "refs/tags/${{ steps.gradle-version-grabber.outputs.mod_version }}"; then
            echo "newTag already exists, failing"
            exit 1
          else
            echo "newTag doesn't exist"
            exit 0
          fi

      - name: Create new tag
        if: ${{ inputs.createTag == true }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "refs/tags/${{ steps.gradle-version-grabber.outputs.mod_version }}",
              sha: context.sha
            })

      - name: Refresh local tags if GitHub release
        if: ${{ inputs.createTag && inputs.publishToGitHub }}
        run: git fetch --tags

      - name: Publish to JackFred Maven
        if: ${{ inputs.publishToMaven == true }}
        run: ./gradlew chiseledPublish
        env:
          JF_MAVEN_USER: ${{ secrets.JF_MAVEN_USER }}
          JF_MAVEN_PASS: ${{ secrets.JF_MAVEN_PASS }}

      - name: Publish as GitHub Release
        if: ${{ inputs.publishToGitHub == true }}
        run: ./gradlew chiseledPublishGithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Curseforge
        if: ${{ inputs.publishToCurseforge == true }}
        run: ./gradlew chiseledPublishCurseforge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

      - name: Publish to Modrinth
        if: ${{ inputs.publishToModrinth == true }}
        run: ./gradlew chiseledPublishModrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}